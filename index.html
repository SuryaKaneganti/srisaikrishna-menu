        :root {

            --text: #f4f4f6; 
            --text-muted: #a0a0ab;
            --border: #2a2a32;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            padding-bottom: 40px; 
            -webkit-font-smoothing: antialiased;
        }

        header { 
            background: linear-gradient(180deg, #16161a 0%, #0f0f11 100%); 
            text-align: center; 
            padding: 25px 15px 20px 15px; 
            border-bottom: 2px solid #282830; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo-container { margin-bottom: 12px; }
        .logo-container img { 
            width: 100px; 
            height: 100px; 
            object-fit: cover;
            border-radius: 50%; 
            border: 2px solid var(--gold); 
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.3);
        }

        header h1 { 
            font-family: 'Cinzel', serif;
            margin: 0; 
            color: var(--gold); 
            font-size: 1.8rem; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        header .subtitle { 
            font-size: 0.8rem; 
            letter-spacing: 3px; 
            color: #d1d1d6; 
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 500;
        }

        header .tagline { 
            font-style: italic; 
            font-size: 0.8rem; 
            color: var(--gold-glow); 
            margin-top: 6px; 
            opacity: 0.9;
        }

        /* Call & Instagram Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .btn-call {
            background-color: #27ae60;
            color: #ffffff;
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .controls { 
            padding: 12px 15px; 
            position: sticky; 
            top: 0; 
            background: rgba(15, 15, 17, 0.95); 
            backdrop-filter: blur(10px);
            z-index: 100; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            border-bottom: 1px solid var(--border); 
        }

        input[type="text"] { 
            padding: 12px 16px; 
            border-radius: 12px; 
            border: 1px solid #33333d; 
            background: #1c1c22; 
            color: #fff; 
            font-size: 0.9rem; 
            font-family: 'Poppins', sans-serif;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        input[type="text"]:focus {
            border-color: var(--gold);
        }

        .cat-pills { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding-bottom: 4px; 
            scrollbar-width: none; 
        }

        .cat-pills::-webkit-scrollbar { display: none; }

        .pill { 
            background: #1e1e24; 
            color: #b0b0ba; 
            border: 1px solid #33333d; 
            padding: 7px 16px; 
            border-radius: 20px; 
            font-size: 0.82rem; 
            font-weight: 500;
            white-space: nowrap; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .pill.active { 
            background: var(--primary); 
            color: #fff; 
            border-color: var(--primary); 
            font-weight: 600; 
            box-shadow: 0 2px 8px rgba(230, 57, 70, 0.4);
        }

        .category-title { 
            font-family: 'Cinzel', serif;
            color: var(--gold); 
            border-bottom: 1px solid var(--border); 
            padding: 12px 15px 6px 15px; 
            margin-top: 15px; 
            font-size: 1.1rem; 
            letter-spacing: 1px; 
            font-weight: 700;
        }

        .menu-grid { 
            padding: 12px 15px; 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 12px; 
        }

        @media (min-width: 600px) { 
            .menu-grid { grid-template-columns: 1fr 1fr; } 
        }

        .item-card { 
            background: var(--card-bg); 
            padding: 14px 16px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .item-name { 
            font-weight: 600; 
            font-size: 0.95rem; 
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .item-desc { 
            font-size: 0.78rem; 
            color: var(--text-muted); 
            margin-top: 4px; 
            line-height: 1.3;
        }

        .item-price { 
            font-weight: 700; 
            color: var(--gold); 
            font-size: 1.05rem; 
            margin-left: 10px;
            white-space: nowrap;
        }

        .badge { 
            font-size: 0.65rem; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-weight: 600; 
            text-transform: uppercase;
        }

        .non-veg { background: rgba(198, 40, 40, 0.2); color: #ef5350; border: 1px solid #c62828; }
        .egg { background: rgba(251, 192, 45, 0.2); color: #ffee58; border: 1px solid #fbc02d; }

        .admin-btn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: var(--primary); 
            border: none; 
            color: white; 
            width: 45px;
            height: 45px;
            border-radius: 50%; 
            font-size: 1.2rem; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.5); 
            z-index: 200; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

    let menuData = JSON.parse(localStorage.getItem('ssk_menu')) || fullDataset;
    let currentCategory = "All";

    function buildCategoryPills() {
        const pillsContainer = document.getElementById('categoryPills');
        const categories = ["All", ...new Set(menuData.map(i => i.cat))];
        pillsContainer.innerHTML = '';

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `pill ${cat === currentCategory ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => filterByCategory(cat);
            pillsContainer.appendChild(btn);
        });
    }

    function filterByCategory(cat) {
        currentCategory = cat;
        buildCategoryPills();
        filterMenu();
    }

    function renderMenu(items) {
        const container = document.getElementById('menuContainer');
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 30px; color:#a0a0ab;">No dishes found matching your search.</p>';
            return;
        }

        const categories = [...new Set(items.map(i => i.cat))];

        categories.forEach(cat => {
            const catTitle = document.createElement('div');
            catTitle.className = 'category-title';
            catTitle.innerText = cat;
            container.appendChild(catTitle);

            const grid = document.createElement('div');
            grid.className = 'menu-grid';

            items.filter(i => i.cat === cat).forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div>
                        <div class="item-name">${item.name} <span class="badge ${item.type.toLowerCase().replace(' ', '-')}">${item.type}</span></div>
                        <div class="item-desc">${item.desc}</div>
                    </div>
                    <div class="item-price">₹${item.price}</div>
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        });
    }

    function filterMenu() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let filtered = menuData;

        if (currentCategory !== "All") {
            filtered = filtered.filter(i => i.cat === currentCategory);
        }

        if (query) {
            filtered = filtered.filter(i => i.name.toLowerCase().includes(query) || i.cat.toLowerCase().includes(query));
        }

        renderMenu(filtered);
    }

    function openAdmin() {
        const pin = prompt("Enter Admin Passcode:");
        if (pin === "1234") {
            const action = prompt("Options:\n1. Update Price\n2. Add New Item\n3. Update Logo Image URL\n4. Reset to Default Data\nEnter option number:");
            if (action === "1") {
                const itemName = prompt("Enter exact Item Name to update price:");
                const item = menuData.find(i => i.name.toLowerCase() === itemName.toLowerCase());
                if (item) {
                    const newPrice = prompt(`Enter new price for ${item.name}:`, item.price);
                    if (newPrice) {
                        item.price = parseInt(newPrice);
                        localStorage.setItem('ssk_menu', JSON.stringify(menuData));
                        alert("Price updated!");
                        renderMenu(menuData);
                    }
                } else { alert("Item not found!"); }
            } else if (action === "2") {
                const cat = prompt("Category (e.g., Biryani, Soups):");
                const name = prompt("Dish Name:");
                const price = parseInt(prompt("Price (in ₹):"));
                const type = prompt("Type (Veg, Non-Veg, Egg):");
                const desc = prompt("Description:");
                if (cat && name && price) {
                    menuData.push({cat, name, price, type, desc: desc || ""});
                    localStorage.setItem('ssk_menu', JSON.stringify(menuData));
                    alert("New dish added!");
                    buildCategoryPills();
                    renderMenu(menuData);
                }
            } else if (action === "3") {
                const logoUrl = prompt("Enter Image URL or filename (e.g., logo.png):");
                if (logoUrl) {
                    localStorage.setItem('ssk_logo', logoUrl);
                    document.getElementById('restaurantLogo').src = logoUrl;
                    alert("Logo updated!");
                }
            } else if (action === "4") {
                if (confirm("Reset menu to default dataset?")) {
                    localStorage.removeItem('ssk_menu');
                    menuData = fullDataset;
                    buildCategoryPills();
                    renderMenu(menuData);
                }
            }
        } else if (pin !== null) {
            alert("Incorrect PIN!");
        }
    }

    // Load custom logo if set via admin settings
    const savedLogo = localStorage.getItem('ssk_logo');
    if (savedLogo) {
        document.getElementById('restaurantLogo').src = savedLogo;
    }

    buildCategoryPills();
    renderMenu(menuData);
